<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1d30">
<title>Ada Kolonileri — Catan tarzı strateji</title>
<style>
:root{--panel:rgba(16,28,44,.82);--line:rgba(255,255,255,.09);--text:#eef2f6;--muted:#93a6ba;--gold:#f2c14e;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);
  background:radial-gradient(ellipse at 35% 25%,#18405f 0%,#0b1d30 55%,#060f19 100%);}
#app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:54px 1fr auto;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.28)}
header h1{font-family:Georgia,serif;font-size:21px;margin:0;letter-spacing:.5px;color:var(--gold);text-shadow:0 2px 6px rgba(0,0,0,.5)}
header .sp{flex:1}
header select,header button{background:#1d3550;color:var(--text);border:1px solid #2f5277;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
header button:hover{background:#264666}
#boardWrap{grid-row:2;grid-column:1;position:relative;min-height:0;display:flex;flex-direction:column}
#board{width:100%;flex:1;min-height:0;display:block;touch-action:none;cursor:grab}
#board.dragging{cursor:grabbing}
#prompt{position:relative;align-self:center;margin:8px 10px 0;flex:none;white-space:normal!important;max-width:calc(100% - 20px);background:rgba(10,20,32,.88);border:1px solid rgba(242,193,78,.45);
  padding:9px 18px;border-radius:999px;font-size:14.5px;box-shadow:0 6px 24px rgba(0,0,0,.4);display:flex;gap:12px;align-items:center;white-space:nowrap;z-index:5}
#prompt button{background:#5a2a2a;border:1px solid #a54848;color:#fff;border-radius:999px;padding:3px 12px;cursor:pointer}
#side{grid-row:2/4;grid-column:2;display:flex;flex-direction:column;gap:10px;padding:10px;min-height:0;border-left:1px solid var(--line);background:rgba(0,0,0,.18)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
#diceBox{display:flex;align-items:center;gap:12px}
.die{width:44px;height:44px;border-radius:9px;background:linear-gradient(145deg,#fff,#dcdcdc);box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 -3px 0 rgba(0,0,0,.12);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px}
.die.red{background:linear-gradient(145deg,#f15a4a,#b8261b)}
.die i{width:8px;height:8px;border-radius:50%;background:#222;place-self:center;visibility:hidden}
.die.red i{background:#fff}
.die i.on{visibility:visible}
.die.roll{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-2px)}100%{transform:rotate(-8deg)}}
#diceSum{font-size:28px;font-weight:700;font-family:Georgia,serif;min-width:36px}
#statsBox:empty{display:none}
.sthead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.bars{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;align-items:end}
.bc{display:flex;flex-direction:column;align-items:center;gap:2px}
.bn{font-size:11px;font-weight:700}
.bt{position:relative;width:100%;height:54px;background:rgba(255,255,255,.04);border-radius:4px}
.bf{position:absolute;bottom:0;left:0;right:0;background:#4f86c6;border-radius:4px 4px 2px 2px;transition:height .3s}
.bf.r68{background:#d9822b}.bf.r7{background:#b8261b}.bf.last{box-shadow:0 0 0 2px var(--gold)}
.be{position:absolute;left:-2px;right:-2px;height:0;border-top:2px dashed rgba(255,255,255,.55)}
.bk{font-size:11px;color:var(--muted)}
.stleg{font-size:10.5px;color:var(--muted);margin-top:4px}.stleg i{display:inline-block;width:14px;border-top:2px dashed rgba(255,255,255,.55);vertical-align:middle}
#diceInfo{font-size:12px;color:var(--muted);flex:1}
.pl{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;border:1px solid transparent;transition:.2s}
.pl.cur{border-color:var(--gold);background:rgba(242,193,78,.08);box-shadow:0 0 0 1px rgba(242,193,78,.2) inset}
.av{width:34px;height:34px;border-radius:50%;border:2px solid rgba(0,0,0,.5);display:grid;place-items:center;font-weight:700;color:#111;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pl .nm{font-weight:600;font-size:14px}
.pl .st{font-size:12px;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap;margin-top:2px}
.pl .vp{margin-left:auto;font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--gold);text-align:right;line-height:1}
.pl .vp small{display:block;font-size:10px;color:var(--muted);font-family:system-ui;font-weight:400}
.badge{font-size:11px;background:#3b2f10;border:1px solid #806523;color:#ffd970;border-radius:6px;padding:0 5px}
#log{flex:1;min-height:0;overflow-y:auto;font-size:12.5px;line-height:1.5}
#log div{padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.05)}
#log div.t{color:var(--gold);font-weight:600;margin-top:4px}
#hand{grid-row:3;grid-column:1;display:flex;gap:14px;align-items:flex-end;padding:10px 14px 12px;border-top:1px solid var(--line);background:rgba(0,0,0,.28);flex-wrap:wrap}
.cards{display:flex;gap:7px;align-items:flex-end}
.card{width:58px;height:80px;border-radius:9px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.25);font-size:26px;user-select:none;transition:transform .15s}
.card .c{position:absolute;top:-8px;right:-8px;background:#111;border:2px solid #fff;border-radius:50%;width:24px;height:24px;font-size:12px;display:grid;place-items:center;font-weight:700}
.card .n{font-size:10px;font-weight:700;margin-top:4px;color:rgba(0,0,0,.75);text-transform:uppercase;letter-spacing:.3px}
.card.zero{opacity:.35}
.card .rt{font-size:9px;font-weight:800;color:rgba(0,0,0,.6);background:rgba(255,255,255,.35);border-radius:4px;padding:0 3px;margin-top:2px}
.res-wood{background:linear-gradient(160deg,#4f9e48,#215a22)}
.res-brick{background:linear-gradient(160deg,#e48756,#9d4123)}
.res-sheep{background:linear-gradient(160deg,#c3e88a,#76b043)}
.res-wheat{background:linear-gradient(160deg,#f8e086,#d9a92c)}
.res-ore{background:linear-gradient(160deg,#c0c6cf,#6c7480)}
.res-wood .n,.res-brick .n,.res-ore .n{color:rgba(255,255,255,.85)}
.dev{background:linear-gradient(160deg,#6b4fa3,#33245a);font-size:22px;cursor:default}
.dev .n{color:#fff;font-size:9px;text-align:center}
.dev.play{cursor:pointer;box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(242,193,78,.6)}
.dev.play:hover{transform:translateY(-5px)}
.dev.new{opacity:.55}
.dev.new::after{content:"YENİ";position:absolute;bottom:3px;font-size:8px;background:#000a;padding:0 4px;border-radius:4px}
.sep{width:1px;align-self:stretch;background:var(--line)}
.btns{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto;align-items:flex-end}
.btn{background:linear-gradient(180deg,#2a4b6e,#1b3350);color:var(--text);border:1px solid #3a6590;border-radius:10px;padding:7px 11px;cursor:pointer;
  font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px;transition:.15s}
.btn small{font-size:11px;font-weight:400;opacity:.85;letter-spacing:-1px}
.btn:hover:not(:disabled){filter:brightness(1.2);transform:translateY(-2px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.gold{background:linear-gradient(180deg,#d7a636,#9c731b);border-color:#f2c14e;color:#1b1203}
.btn.end{background:linear-gradient(180deg,#7a3434,#4f1f1f);border-color:#b44}
#modal{position:fixed;inset:0;background:rgba(3,8,14,.65);display:none;place-items:center;z-index:20;backdrop-filter:blur(3px)}
#modal.show{display:grid}
.box{background:linear-gradient(180deg,#1c3048,#132235);border:1px solid #39597c;border-radius:16px;padding:20px 24px;min-width:360px;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.box h2{margin:0 0 6px;font-family:Georgia,serif;color:var(--gold)}
.box p{color:#c9d6e3;margin:6px 0 14px;font-size:14px;line-height:1.5}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.rc{display:flex;flex-direction:column;align-items:center;gap:6px}
.rc .card{width:52px;height:72px;font-size:22px;cursor:pointer}
.rc .card.sel{box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(242,193,78,.7);transform:translateY(-4px)}
.rc .card.dis{opacity:.3;cursor:not-allowed}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:24px;height:24px;border-radius:6px;border:1px solid #3a6590;background:#1b3350;color:#fff;cursor:pointer}
.stp b{min-width:14px;text-align:center}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:8px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.actions button,.vbtn{background:#264666;border:1px solid #3a6590;color:#fff;border-radius:9px;padding:8px 16px;cursor:pointer;font-weight:600}
.actions button.primary{background:linear-gradient(180deg,#d7a636,#9c731b);border-color:#f2c14e;color:#1b1203}
.actions button:disabled{opacity:.4;cursor:not-allowed}
.resp{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.2);margin:5px 0}
.resp span{flex:1}
.score{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.2);margin:4px 0}
.rules{font-size:13.5px;line-height:1.55;color:#d3dee9;max-height:60vh;overflow:auto}
.rules b{color:var(--gold)}
svg .pick{cursor:pointer}
svg .pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
svg .hit{fill:transparent;stroke:transparent}
.tok.flash circle{animation:flash 1.4s ease-out}
@keyframes flash{0%{stroke:#fff36b;stroke-width:6}100%{stroke-width:2}}
@media (max-width:1100px){#app{grid-template-columns:1fr 280px}.card{width:50px;height:70px}}
.inp{width:100%;background:#0d1a29;border:1px solid #3a6590;color:#fff;border-radius:9px;padding:9px 12px;font-size:15px;margin:4px 0 6px}
.inp.code{text-transform:uppercase;letter-spacing:5px;font-size:20px;text-align:center;font-family:Consolas,monospace}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:10px}
.col{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.col h3{margin:0 0 4px;font-size:16px}
.seg{display:flex;gap:0;border:1px solid #3a6590;border-radius:9px;overflow:hidden;width:max-content}
.seg button{background:#132538;color:#c9d6e3;border:0;padding:7px 14px;cursor:pointer;font-size:13px}
.seg button.on{background:linear-gradient(180deg,#d7a636,#9c731b);color:#1b1203;font-weight:700}
.seg.sm button{padding:4px 10px;font-size:12px}
.seat{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.03);margin:3px 0;min-height:38px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.5);flex:none}
.big{margin-top:10px;padding:10px 14px;border-radius:10px;border:1px solid #3a6590;background:#264666;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.big.primary{background:linear-gradient(180deg,#d7a636,#9c731b);border-color:#f2c14e;color:#1b1203}
.codebox{display:flex;align-items:center;gap:14px;justify-content:center;background:#0d1a29;border:1px dashed #f2c14e;border-radius:12px;padding:12px;margin:8px 0 14px}
.codebox span{font-family:Consolas,monospace;font-size:34px;letter-spacing:8px;color:var(--gold);font-weight:700}
.err{color:#ff8a7a!important}.ok{color:#7be08a;font-size:12px}.small{font-size:12.5px!important;color:var(--muted)!important;margin:2px 0 6px!important}
.tr{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0}
.tr .arrow{font-size:28px;color:var(--gold)}
.tr .bigres{font-size:22px;background:rgba(0,0,0,.25);border-radius:10px;padding:8px 12px;min-width:120px;text-align:center}
#netInfo{font-size:12.5px;background:#10304b;border:1px solid #2f5277;border-radius:999px;padding:4px 12px;display:none}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}

#sideBtn{display:none}#mini{display:none}#shade{display:none}
.mp{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.05);border:1px solid transparent;border-radius:999px;padding:2px 8px 2px 2px;font-size:13px;white-space:nowrap}
.mp.cur{border-color:var(--gold);background:rgba(242,193,78,.12)}
.mp small{font-size:11px;color:var(--muted)}.mp.dice{padding:2px 8px;margin-left:auto}
.av.s{width:22px;height:22px;font-size:11px;border-width:1.5px}
#zoomCtl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:5px;z-index:4}
#zoomCtl button{width:36px;height:36px;border-radius:10px;border:1px solid #3a6590;background:rgba(16,32,50,.88);color:#fff;font-size:19px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.4);line-height:1}
#zoomCtl button:hover{background:#264666}
#zoomCtl #zReset{font-size:15px}
#tip{position:absolute;display:none;z-index:6;pointer-events:none;background:rgba(8,16,26,.95);border:1px solid #3a6590;border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.6;max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#tip .pp{color:#c9a34a;font-size:9px;letter-spacing:1px}#tip .tt{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;color:#c9d6e3}
.warn7{position:absolute;left:14px;top:-30px;background:#5c1a14;border:1px solid #c0392b;color:#ffd2cc;font-size:12.5px;font-weight:600;padding:4px 12px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:pulse 1.6s infinite}
#hand{position:relative}
.hot7{color:#ff8a7a;font-weight:700}
.devbig{font-size:54px;text-align:center;margin-top:-4px}
.box.narrow{max-width:420px}.box.wide{max-width:900px}.box.menu{max-width:720px}
.tblwrap{overflow-x:auto;margin:8px 0}
table.sum{border-collapse:collapse;width:100%;font-size:13px}
table.sum th{font-size:11px;color:var(--muted);font-weight:600;padding:6px 7px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
table.sum td{padding:7px;text-align:center;border-bottom:1px solid rgba(255,255,255,.05)}
table.sum td:first-child{text-align:left;white-space:nowrap}
table.sum td.top{color:var(--gold);font-weight:700}
.resume{display:flex;align-items:center;gap:10px;background:rgba(242,193,78,.08);border:1px solid rgba(242,193,78,.4);border-radius:12px;padding:10px 12px;margin:8px 0}
.resume>div{flex:1}.resume .small{margin:2px 0 0!important}
.big.sm{margin-top:0;padding:8px 14px;font-size:14px;white-space:nowrap}
.seg.off{opacity:.45}
.code-inline{font-family:Consolas,monospace;letter-spacing:3px;color:var(--gold)}
.btn .bl{white-space:nowrap}
.cards{flex-wrap:nowrap}
@media (max-width:820px){
  body{overflow:hidden}
  #app{grid-template-columns:1fr;grid-template-rows:46px 1fr auto;height:100dvh}
  header{gap:6px;padding:0 8px}
  header h1{font-size:15px;white-space:nowrap}
  #netInfo{font-size:11px;padding:3px 8px}
  header .sp{flex:1}
  header .sub,.hm{display:none}
  header select,header button{padding:5px 8px;font-size:13px}
  #speedLbl{font-size:0!important}#speedLbl select{font-size:12px}
  #sideBtn{display:inline-block}
  #side{position:fixed;top:0;right:0;bottom:0;width:min(88vw,360px);z-index:15;transform:translateX(105%);transition:transform .25s;background:#0d1b2b;border-left:1px solid #2f5277;padding:10px;padding-top:max(10px,env(safe-area-inset-top))}
  body.side-open #side{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.6)}
  body.side-open #shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:14}
  #boardWrap{display:flex;flex-direction:column}
  #mini{display:flex;gap:5px;padding:5px 6px;overflow-x:auto;background:rgba(0,0,0,.25);border-bottom:1px solid var(--line);flex:none}
  .mp{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.05);border:1px solid transparent;border-radius:999px;padding:2px 8px 2px 2px;font-size:13px;white-space:nowrap}
  .mp.cur{border-color:var(--gold);background:rgba(242,193,78,.12)}
  .mp small{font-size:11px;color:var(--muted)}.mp.dice{padding:2px 8px;margin-left:auto}
  .av.s{width:22px;height:22px;font-size:11px;border-width:1.5px}
  #board{flex:1;min-height:0}
  #prompt{position:static;transform:none;margin:5px 6px 0;white-space:normal;font-size:13px;padding:6px 12px;border-radius:12px;justify-content:space-between;flex:none}
  #prompt button{flex:none}
  #hand{grid-column:1;grid-row:3;gap:6px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));flex-direction:column;align-items:stretch}
  .cards{overflow-x:auto;gap:5px;padding:9px 6px 2px}
  .card{width:44px;height:60px;font-size:19px;flex:none;border-radius:7px}
  .card .c{width:20px;height:20px;font-size:11px;top:-7px;right:-6px}
  .card .n{font-size:8px;margin-top:2px}.card .rt{font-size:8px}
  .dev{font-size:17px}
  .btns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:0}
  .btn{min-width:0;padding:5px 2px;font-size:11.5px;border-radius:8px}
  .btn small{font-size:9.5px;letter-spacing:-1.5px}
  .warn7{position:static;font-size:11.5px;padding:3px 10px;text-align:center;animation:none}
  .box{min-width:0;width:94vw;max-height:88dvh;overflow-y:auto;padding:16px}
  .two{grid-template-columns:1fr}
  .rc .card{width:46px;height:64px;font-size:19px}
  .row{gap:6px}
  .codebox span{font-size:26px;letter-spacing:5px}.codebox{flex-direction:column;gap:8px}
  .tr{gap:8px}.tr .bigres{min-width:90px;font-size:18px}
  #tip{display:none!important}
}

@media (max-height:560px) and (orientation:landscape){
  #app{grid-template-columns:1fr minmax(250px,36vw);grid-template-rows:40px 1fr;height:100dvh}
  header{gap:6px;padding:0 8px}
  header h1{font-size:15px;white-space:nowrap}
  header .sub,.hm{display:none}
  header select,header button{padding:4px 8px;font-size:13px}
  #netInfo{font-size:11px;padding:3px 8px}
  #speedLbl{font-size:0!important}#speedLbl select{font-size:12px}
  #sideBtn{display:inline-block}
  #side{position:fixed;top:0;right:0;bottom:0;width:min(88vw,360px);z-index:15;transform:translateX(105%);transition:transform .25s;background:#0d1b2b;border-left:1px solid #2f5277;padding:10px;overflow-y:auto}
  body.side-open #side{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.6)}
  body.side-open #shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:14}
  #boardWrap{grid-row:2;grid-column:1}
  #mini{display:flex;gap:5px;padding:3px 6px;overflow-x:auto;background:rgba(0,0,0,.25);border-bottom:1px solid var(--line);flex:none}
  #prompt{font-size:12px;padding:4px 10px;margin:4px 6px 0;border-radius:10px}
  #hand{grid-row:2;grid-column:2;flex-direction:column;align-items:stretch;flex-wrap:nowrap;overflow-y:auto;border-top:0;border-left:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:6px}
  .cards{flex-wrap:wrap;overflow:visible;gap:7px 6px;padding:9px 2px 0}
  .card{width:42px;height:56px;font-size:17px;flex:none;border-radius:7px}
  .card .c{width:19px;height:19px;font-size:10.5px;top:-7px;right:-6px}
  .card .n{font-size:7.5px;margin-top:1px}.card .rt{font-size:7.5px}
  .sep{display:none}
  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0}
  .btn{min-width:0;padding:4px 2px;font-size:11px;border-radius:8px}
  .btn small{font-size:9px;letter-spacing:-1.5px}
  .warn7{position:static;font-size:11px;padding:3px 8px;text-align:center;animation:none}
  .box{min-width:0;max-height:92dvh;overflow-y:auto;padding:14px}
  .rc .card{width:44px;height:60px}
  #zoomCtl button{width:32px;height:32px;font-size:17px}
  #tip{display:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>⚓ <span class="hm">Ada </span>Kolonileri</h1>
    <span class="sub" style="color:var(--muted);font-size:13px">Catan tarzı · 10 puana ilk ulaşan kazanır</span>
    <span class="sp"></span>
    <span id="netInfo"></span>
    <label id="speedLbl" style="font-size:13px;color:var(--muted)">Bot hızı
      <select id="speed"><option value="1.7">Yavaş</option><option value="1" selected>Normal</option><option value="0.45">Hızlı</option></select>
    </label>
    <button id="soundBtn" title="Sesli bildirim aç/kapat">🔔</button>
    <button id="rulesBtn">📜<span class="hm"> Kurallar</span></button>
    <button id="newBtn">🏠<span class="hm"> Ana menü</span></button>
    <button id="sideBtn" title="Oyuncular, istatistik, günlük">📋</button>
  </header>
  <div id="boardWrap">
    <div id="mini"></div>
    <div id="prompt"></div>
    <div id="tip"></div>
    <div id="zoomCtl"><button id="zIn" title="Yakınlaştır">+</button><button id="zOut" title="Uzaklaştır">−</button><button id="zReset" title="Tümünü göster">⤢</button></div>
    <svg id="board" viewBox="-324 -298 648 596" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div id="hand"></div>
  <aside id="side">
    <div class="panel" id="diceBox">
      <div class="die" id="d1"></div><div class="die red" id="d2"></div>
      <div id="diceSum">–</div><div id="diceInfo">Zar henüz atılmadı</div>
    </div>
    <div class="panel" id="statsBox"></div>
    <div class="panel" id="players"></div>
    <div class="panel" id="log"></div>
  </aside>
</div>
<div id="shade"></div>
<div id="modal"></div>

<script>

function buildBoard(){
  const coords=[];for(let q=-2;q<=2;q++)for(let r=-2;r<=2;r++)if(Math.abs(q+r)<=2)coords.push([q,r]);
  const terrBag=[...Array(4).fill('wood'),...Array(3).fill('brick'),...Array(4).fill('sheep'),...Array(4).fill('wheat'),...Array(3).fill('ore'),'desert'];
  const numBag=[2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12];
  const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];

      vertices[v].hexes.push(h.id);h.vertices.push(v);
    }
    for(let i=0;i<6;i++){
      const a=h.vertices[i],b=h.vertices[(i+1)%6],key=Math.min(a,b)+'-'+Math.max(a,b);
      let e=emap.get(key);

  const types=shuffle(['any','any','any','any','wood','brick','sheep','wheat','ore']);
  const off=Math.random()*coast.length|0;const ports=[];
  [0,3,6,10,13,16,20,23,26].forEach((ix,i)=>{
    const c=coast[(ix+off)%coast.length],h=hexes[c.e.hexes[0]];
    const dx=c.mx-h.x,dy=c.my-h.y,L=Math.hypot(dx,dy);
    ports.push({edge:c.e.id,type:types[i],x:c.mx+dx/L*30,y:c.my+dy/L*30});
    c.e.v.forEach(v=>vertices[v].port=types[i]);
  });
  return{hexes,vertices,edges,ports};
}

/* ================== ÇİZİM ================== */
const TCOL={wood:['#4c9a43','#1d5220'],brick:['#df7c4b','#963c1f'],sheep:['#b4e275','#69a73a'],wheat:['#f6db72','#d2a228'],ore:['#a9b0bb','#5f6773'],desert:['#f2dfae','#cdae6e']};
function rng(seed){let s=seed*9301+49297;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function deco(type,x,y,r){
  const t=`transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${(0.85+r()*0.35).toFixed(2)})"`;
  switch(type){
    case'wood':return`<g ${t}><rect x="-1.6" y="3" width="3.2" height="6" fill="#5b3a1e"/><polygon points="0,-13 8,0 -8,0" fill="#1a4f1d"/><polygon points="0,-8 9.5,5 -9.5,5" fill="#277a2c"/><polygon points="0,-13 3,-8 -3,-8" fill="#3a9a3f" opacity=".6"/></g>`;
    case'brick':return`<g ${t}><path d="M-12,7 Q-4,-9 4,-2 Q9,-6 13,7 Z" fill="#8a3518" opacity=".55"/><rect x="-9" y="1" width="8" height="4" fill="#b8481f" stroke="#6e2a10" stroke-width=".8"/><rect x="0" y="1" width="8" height="4" fill="#c4542a" stroke="#6e2a10" stroke-width=".8"/><rect x="-4.5" y="-3" width="8" height="4" fill="#cf5f32" stroke="#6e2a10" stroke-width=".8"/></g>`;
    case'sheep':return`<g ${t}><line x1="-3" y1="3" x2="-3" y2="7" stroke="#333" stroke-width="1.5"/><line x1="3" y1="3" x2="3" y2="7" stroke="#333" stroke-width="1.5"/><ellipse rx="7" ry="5" fill="#fbfbf5" stroke="#d8d8cc" stroke-width=".8"/><circle cx="-3" cy="-2" r="3" fill="#fff"/><circle cx="2" cy="-3" r="3" fill="#fff"/><ellipse cx="7" cy="-2" rx="2.6" ry="2.2" fill="#2d2d2d"/></g>`;
    case'wheat':{let s=`<g ${t}>`;for(const dx of[-4,0,4]){s+=`<line x1="${dx}" y1="9" x2="${dx*0.6}" y2="-8" stroke="#9b7414" stroke-width="1.2"/>`;for(let k=0;k<4;k++)s+=`<ellipse cx="${dx*0.6+(k%2?1.6:-1.6)}" cy="${-7+k*3}" rx="1.6" ry="2.6" fill="#c8901b" transform="rotate(${k%2?25:-25} ${dx*0.6+(k%2?1.6:-1.6)} ${-7+k*3})"/>`;}return s+'</g>';}
    case'ore':return`<g ${t}><polygon points="-13,8 -3,-11 8,8" fill="#4f5661"/><polygon points="-3,-11 -7,-3 -4,-5 -1,-2 1,-6" fill="#f1f3f5"/><polygon points="0,8 7,-4 14,8" fill="#6a727e"/><polygon points="7,-4 5,0 7,-1 9,0" fill="#e9ecef"/></g>`;
    case'desert':return r()<0.5?`<g ${t}><rect x="-2" y="-9" width="4" height="17" rx="2" fill="#3f8a43"/><path d="M-2,0 h-4 v-6" stroke="#3f8a43" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M2,2 h4 v-5" stroke="#3f8a43" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>`:`<g ${t}><path d="M-12,5 Q0,-4 12,5" stroke="#b9934f" stroke-width="2" fill="none"/><path d="M-6,9 Q3,3 11,9" stroke="#b9934f" stroke-width="1.5" fill="none"/></g>`;
  }
}
function hexPts(h,sc=1){let p=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);p.push((h.x+S*sc*Math.cos(a)).toFixed(1)+','+(h.y+S*sc*Math.sin(a)).toFixed(1));}return p.join(' ');}
function renderBoard(){
  const svg=$('#board');let s=`<defs>
  <radialGradient id="sea" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="700"><stop offset="0" stop-color="#2f8cc4"/><stop offset=".55" stop-color="#17608f"/><stop offset="1" stop-color="#0b3556"/></radialGradient>
  <pattern id="waves" width="46" height="26" patternUnits="userSpaceOnUse"><path d="M0,13 q11.5,-8 23,0 t23,0" stroke="#fff" stroke-width="1.2" fill="none" opacity=".13"/></pattern>
  <radialGradient id="sand" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#f3dfa6"/><stop offset="1" stop-color="#d9b874"/></radialGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2.2" stdDeviation="1.6" flood-opacity=".5"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>`;
  for(const[k,[a,b]]of Object.entries(TCOL))s+=`<radialGradient id="g-${k}" cx="45%" cy="35%" r="75%"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`;
  s+=`</defs><rect x="-1500" y="-1200" width="3000" height="2400" fill="#0b3556"/><circle r="900" fill="url(#sea)"/><rect x="-1500" y="-1200" width="3000" height="2400" fill="url(#waves)"/>`;
  // kumsal
  s+=`<g filter="url(#soft)" opacity=".5">${G.hexes.map(h=>`<polygon points="${hexPts(h,1.28)}" fill="#7fd0f0"/>`).join('')}</g>`;
  s+=`<g>${G.hexes.map(h=>`<polygon points="${hexPts(h,1.16)}" fill="url(#sand)"/>`).join('')}</g>`;
  // limanlar
  for(const p of G.ports){const e=G.edges[p.edge];
    for(const v of e.v){const vx=G.vertices[v];s+=`<line x1="${p.x}" y1="${p.y}" x2="${vx.x}" y2="${vx.y}" stroke="#7a5527" stroke-width="5" stroke-linecap="round"/><line x1="${p.x}" y1="${p.y}" x2="${vx.x}" y2="${vx.y}" stroke="#c99a5b" stroke-width="2.5" stroke-dasharray="3 3" stroke-linecap="round"/>`;}
  }
  // araziler
  for(const h of G.hexes){
    s+=`<polygon points="${hexPts(h)}" fill="url(#g-${h.type})" stroke="#4a3518" stroke-width="2.5"/>`;
    s+=`<polygon points="${hexPts(h,0.9)}" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="2"/>`;
    const r=rng(h.id+7+(h.num||3)*31);const n=h.type==='desert'?5:7;let items=[];

function housePath(x,y,c){return`<path transform="translate(${x},${y})" d="M-9,8 L9,8 L9,-2 L0,-11 L-9,-2 Z" fill="${c}" stroke="#1a1a1a" stroke-width="1.8" stroke-linejoin="round" filter="url(#sh)"/><path transform="translate(${x},${y})" d="M-3,8 v-5 h6 v5" fill="rgba(0,0,0,.25)"/>`;}
function cityPath(x,y,c){return`<path transform="translate(${x},${y})" d="M-14,10 L14,10 L14,-3 L3,-3 L3,-6 L-5.5,-15 L-14,-6 Z" fill="${c}" stroke="#1a1a1a" stroke-width="1.8" stroke-linejoin="round" filter="url(#sh)"/><path transform="translate(${x},${y})" d="M-9,-2 h4 v4 h-4z M6,2 h4 v4 h-4z" fill="rgba(0,0,0,.28)"/>`;}
function renderPieces(){
  let s='';
  for(const e of G.edges){if(e.road===null)continue;const a=G.vertices[e.v[0]],b=G.vertices[e.v[1]];
    const k=.14,x1=a.x+(b.x-a.x)*k,y1=a.y+(b.y-a.y)*k,x2=b.x-(b.x-a.x)*k,y2=b.y-(b.y-a.y)*k;
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#161616" stroke-width="10" stroke-linecap="round"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${G.players[e.road].color}" stroke-width="6.5" stroke-linecap="round"/>`;}
  for(const v of G.vertices){if(!v.building)continue;const c=G.players[v.building.player].color;s+=v.building.type==='city'?cityPath(v.x,v.y,c):housePath(v.x,v.y,c);}
  const h=G.hexes[G.robber];const rx=h.x-(h.num?31:0),ry=h.y-(h.num?3:0);
  s+=`<g transform="translate(${rx},${ry}) scale(${h.num?0.9:1})" filter="url(#sh)"><ellipse cy="16" rx="11" ry="3.5" fill="rgba(0,0,0,.4)"/><path d="M-9,16 Q-11,-1 -5,-5 L5,-5 Q11,-1 9,16 Z" fill="#262626" stroke="#000" stroke-width="1"/><circle cy="-11" r="7" fill="#262626" stroke="#000" stroke-width="1"/><path d="M-6,1 Q0,4 6,1" stroke="#555" stroke-width="1.4" fill="none"/></g>`;
  $('#pieces').innerHTML=s;
}

/* ================== TAHTA ÜSTÜ KATMANLAR ================== */
function renderTokens(){
  let s='';
  for(const h of G.hexes){if(!h.num)continue;const red=h.num===6||h.num===8,rob=G.robber===h.id,hot=G.rolled&&G.lastRoll===h.num;
    s+=`<g filter="url(#sh)"><circle cx="${h.x}" cy="${h.y}" r="18" fill="${rob?'#e9dcc0':'#f6e8c6'}" stroke="${hot?'#ffd84a':'#8b6b3a'}" stroke-width="${hot?4.5:2}"/>
      <text x="${h.x}" y="${h.y+5}" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="${red?19:17}" fill="${red?'#c0261a':'#2a1d0c'}">${h.num}</text>`;
    const d=PIPS[h.num];for(let i=0;i<d;i++)s+=`<circle cx="${h.x+(i-(d-1)/2)*4.2}" cy="${h.y+11}" r="1.4" fill="${red?'#c0261a':'#2a1d0c'}"/>`;
    if(rob)s+=`<circle cx="${h.x}" cy="${h.y}" r="22" fill="none" stroke="#e8372a" stroke-width="3.5" stroke-dasharray="5 3.5"/><line x1="${h.x-15}" y1="${h.y+15}" x2="${h.x+15}" y2="${h.y-15}" stroke="#e8372a" stroke-width="3" stroke-linecap="round" opacity=".85"/>`;
    s+='</g>';}
  $('#tokens').innerHTML=s;
}
function spotPips(v){let s=0;for(const h of G.vertices[v].hexes){const hx=G.hexes[h];if(hx.num)s+=PIPS[hx.num];}return s;}
function renderHighlights(){
  const ps=G.pickState;let s='';
  if(ps&&ps.seat===ME){

function canAfford(p,c){return!!p.res&&Object.entries(c).every(([r,n])=>p.res[r]>=n);}
function pay(p,c){for(const[r,n]of Object.entries(c)){p.res[r]-=n;G.bank[r]+=n;}}
function gain(p,r,n){n=Math.min(n,G.bank[r]);p.res[r]+=n;G.bank[r]-=n;return n;}
function vp(p,pub){let s=p.settlements.length+2*p.cities.length+(G.lrOwner===p.id?2:0)+(G.laOwner===p.id?2:0);if(!pub)s+=p.vpCards||0;return s;}
function rate(p,r){let b=4;for(const v of[...p.settlements,...p.cities]){const pt=G.vertices[v].port;if(pt==='any')b=Math.min(b,3);if(pt===r)b=2;}return b;}
function spotFree(v){const vx=G.vertices[v];return!vx.building&&vx.adjV.every(u=>!G.vertices[u].building);}
function validSettlementSpots(p,setup){if(p.settlements.length>=5)return[];return G.vertices.filter(v=>spotFree(v.id)&&(setup||v.edges.some(e=>G.edges[e].road===p.id))).map(v=>v.id);}
function inNetwork(p,u){const vx=G.vertices[u];if(vx.building)return vx.building.player===p.id;return vx.edges.some(e=>G.edges[e].road===p.id);}
function validRoadEdges(p,fromV){if(p.roads.length>=15)return[];if(fromV!=null)return G.vertices[fromV].edges.filter(e=>G.edges[e].road===null);
  return G.edges.filter(e=>e.road===null&&e.v.some(u=>inNetwork(p,u))).map(e=>e.id);}

function cleanRes(o){const c={};RES.forEach(r=>{const n=Math.floor(+((o||{})[r])||0);if(n>0&&n<20)c[r]=n;});return c;}
const hasRes=(p,o)=>RES.every(r=>p.res[r]>=(o[r]||0));
function longestRoad(pid){
  let best=0;
  const dfs=(v,used,len)=>{if(len>best)best=len;const b=G.vertices[v].building;if(len>0&&b&&b.player!==pid)return;
    for(const ei of G.vertices[v].edges){if(G.edges[ei].road!==pid||used.has(ei))continue;used.add(ei);const e=G.edges[ei];dfs(e.v[0]===v?e.v[1]:e.v[0],used,len+1);used.delete(ei);}};
  for(const e of G.edges)if(e.road===pid){dfs(e.v[0],new Set(),0);dfs(e.v[1],new Set(),0);}
  return best;
}
function updateLongestRoad(){

  if(h>=0&&P(h).roadLen>=5&&P(h).roadLen>=max)return;
  const top=G.players.filter(p=>p.roadLen===max&&max>=5);
  const n=top.length===1?top[0].id:-1;
  if(n!==h){G.lrOwner=n;if(n>=0)log(`🛤️ ${name(P(n))} <b>En Uzun Yol</b> kartını aldı (${max})!`);else log(`🛤️ En Uzun Yol kartı artık kimsede değil.`);}
}

      res:{wood:0,brick:0,sheep:0,wheat:0,ore:0},dev:[],newDev:[],vpCards:0,knights:0,settlements:[],cities:[],roads:[],roadLen:0})),
    bank:{wood:19,brick:19,sheep:19,wheat:19,ore:19},
    devDeck:shuffle([...Array(14).fill('knight'),...Array(5).fill('vp'),'road','road','plenty','plenty','monopoly','monopoly']),
    robber:0,current:0,phase:'setup',rolled:false,devPlayed:false,lrOwner:-1,laOwner:-1,turnNo:0,pickState:null,busy:false,prompt:{seat:-1,text:''},endTurnResolve:null,
    lastRoll:null,lastDice:null,winner:-1,rollStats:Array(13).fill(0),undo:[],pending:null,setupIdx:0,setupStage:'settlement',setupV:null,setupSnap:null,
    stats:seats.map(()=>({prod:0,blocked:0,stole:0,lost:0,discarded:0,bank:0,trades:0,dev:0}))};

  runGame(false);

async function runGame(resume){
  try{
    const n=G.n,order=[...Array(n).keys(),...[...Array(n).keys()].reverse()];
    if(G.phase==='setup'){
      for(let i=G.setupIdx;i<order.length;i++){G.setupIdx=i;G.current=order[i];renderAll();await setupTurn(P(order[i]),i>=n);}
      G.setupIdx=order.length;G.phase='main';G.current=0;resume=false;log('Kuruluş bitti — oyun başlıyor!','t');
    }
    let cont=resume&&G.turnNo>0;
    while(true){
      if(!cont){G.turnNo++;G.rolled=false;G.devPlayed=false;G.undo=[];G.pending=null;log(`— Tur ${G.turnNo}: ${name(P(G.current))} —`,'t');}
      cont=false;const p=P(G.current);renderAll();
      if(checkWin())return;
      if(G.pending)await resumePending(p);
      if(G.phase!=='main')return;
      if(p.isBot)await botTurn(p);else await humanTurn(p);
      if(G.phase!=='main')return;
      p.dev.push(...p.newDev);p.newDev=[];G.undo=[];
      G.current=(G.current+1)%G.n;
      if(AUTO&&G.turnNo>800){console.log('TURN LIMIT');return;}
    }
  }catch(e){if(e!==ABORT)console.error(e);}
}
async function resumePending(p){
  const pd=G.pending;if(!pd)return;
  if(pd.type==='discard'){await runDiscards();await moveRobber(p);}
  else if(pd.type==='robber'||pd.type==='steal')await moveRobber(p);
  else if(pd.type==='dev')await devEffect(p);
  G.pending=null;renderAll();
}
async function setupTurn(p,second){
  while(true){
    let v;
    if(G.setupStage==='road'&&G.setupV!=null)v=G.setupV;
    else{
      const snap=undoSnap();
      if(p.isBot){setPrompt(`${esc(p.name)} köyünü yerleştiriyor…`);await sleep(650);v=botSetupVertex(p);}
      else v=await pick(p,'vertex',validSettlementSpots(p,true),false,`${second?'2.':'1.'} köyünü yerleştir — parlayan noktalardan birine dokun (rakam: o noktanın verimi)`);
      placeSettlement(p,v);
      if(second){const got={};for(const h of G.vertices[v].hexes){const hx=G.hexes[h];if(hx.type!=='desert'&&gain(p,hx.type,1))got[hx.type]=(got[hx.type]||0)+1;}
        log(`${name(p)} köy kurdu ve aldı: ${resStr(got)||'—'}`);}else log(`${name(p)} köyünü kurdu.`);
      G.setupStage='road';G.setupV=v;G.setupSnap=snap;renderAll();
    }
    let e;
    if(p.isBot){await sleep(450);e=botSetupRoad(p,v);}
    else e=await pick(p,'edge',validRoadEdges(p,v),true,'Şimdi bu köye bitişik bir yol yerleştir','↩️ Köyü geri al');
    if(e==null){restoreSnap(G.setupSnap);G.setupStage='settlement';G.setupV=null;G.setupSnap=null;log(`↩️ ${name(p)} köyünü geri aldı.`);renderAll();continue;}
    placeRoad(p,e);G.setupStage='settlement';G.setupV=null;G.setupSnap=null;renderAll();return;
  }
}

function distribute(n){
  const gains=G.players.map(()=>({wood:0,brick:0,sheep:0,wheat:0,ore:0}));
  for(const h of G.hexes){if(h.num!==n)continue;
    for(const v of h.vertices){const b=G.vertices[v].building;if(!b)continue;const k=b.type==='city'?2:1;
      if(h.id===G.robber)ST(b.player).blocked+=k;else gains[b.player][h.type]+=k;}}
  for(const r of RES){const tot=gains.reduce((a,g)=>a+g[r],0);if(!tot)continue;const rec=gains.filter(g=>g[r]>0).length;
    if(tot>G.bank[r]){if(rec>1){log(`Bankada yeterli ${RNAME[r]} yok — kimse alamadı.`);gains.forEach(g=>g[r]=0);continue;}gains.forEach(g=>{if(g[r])g[r]=G.bank[r];});}
    gains.forEach((g,i)=>{if(g[r]){ST(i).prod+=gain(P(i),r,g[r]);}});}
  let any=false;gains.forEach((g,i)=>{const s=resStr(g);if(s){any=true;log(`&nbsp;&nbsp;${name(P(i))} aldı: ${s}`);}});
  const rh=G.hexes[G.robber];if(rh.num===n&&rh.vertices.some(v=>G.vertices[v].building))log(`&nbsp;&nbsp;🦹 Hırsız ${n} numaralı ${TNAME[rh.type].toLowerCase()} üretimini engelledi.`);
  if(!any)log('&nbsp;&nbsp;Kimse kaynak üretmedi.');
}

function validDiscard(q,sel,n){if(!sel||typeof sel!=='object')return false;let s=0;for(const r of RES){const k=sel[r]|0;if(k<0||k>q.res[r])return false;s+=k;}return s===n;}

async function moveRobber(p){

async function playDev(p,type){

async function devEffect(p){

  else if(type==='road'){while(pd.left>0){const valid=validRoadEdges(p);if(!valid.length)break;let e;
      if(p.isBot){await sleep(400);e=botBestRoad(p,valid);}else e=await pick(p,'edge',valid,true,`Yol Yapımı: ücretsiz yol ${3-pd.left}/2`,'Kalanı kullanma');
      if(e==null)break;placeRoad(p,e);pd.left--;renderAll();}}
  else if(type==='plenty'){let picks=p.isBot?botPlenty(p):await ask(p.id,'chooseRes',{title:'🎁 Bolluk Yılı',msg:'Bankadan alacağın 2 kaynağı seç (aynısını iki kez seçebilirsin).',count:2,fromBank:true});
    if(!Array.isArray(picks))picks=botPlenty(p);picks=picks.filter(r=>RES.includes(r)).slice(0,2);
    const got={};picks.forEach(r=>{if(gain(p,r,1))got[r]=(got[r]||0)+1;});log(`&nbsp;&nbsp;${name(p)} bankadan aldı: ${resStr(got)||'—'}`);}
  else if(type==='monopoly'){let r=p.isBot?botMonopoly(p):((await ask(p.id,'chooseRes',{title:'💰 Tekel',msg:'Tüm oyunculardan toplayacağın kaynağı seç.',count:1,fromBank:false}))||[])[0];
    if(!RES.includes(r))r=botMonopoly(p);
    let t=0;G.players.forEach(q=>{if(q!==p){t+=q.res[r];p.res[r]+=q.res[r];q.res[r]=0;}});ST(p.id).stole+=t;log(`&nbsp;&nbsp;${name(p)} herkesten ${t}${RICON[r]} topladı!`);}
  G.pending=null;renderAll();checkWin();
}
function buyDev(p){pay(p,COST.dev);const c=G.devDeck.pop();if(c==='vp')p.vpCards++;else p.newDev.push(c);ST(p.id).dev++;G.undo=[];
  log(`${name(p)} bir gelişim kartı aldı.`);if(!p.isBot)log(`&nbsp;&nbsp;Çektiğin kart: ${DEVICON[c]} <b>${DEVNAME[c]}</b>`,'',[p.id]);return c;}
async function proposeTrade(p,give,get){
  give=cleanRes(give);get=cleanRes(get);
  if(!Object.keys(give).length||!Object.keys(get).length||RES.some(r=>give[r]&&get[r])||!hasRes(p,give))return false;
  if(!p.isBot)setPrompt('Teklifine cevaplar bekleniyor…',p.id);
  const responses=await Promise.all(G.players.filter(q=>q!==p).map(async q=>{
    let a;if(q.isBot)a=botEvalTrade(q,get,give,p);
    else if(!hasRes(q,get))a=false; // yeterli kartı yoksa teklif hiç gösterilmez
    else a=await ask(q.id,'tradeOffer',{from:p.id,youGet:give,youGive:get},30000);
    return[q.id,!!a&&hasRes(q,get)];}));
  let partner=null;const acc=responses.filter(r=>r[1]).map(r=>r[0]);
  if(p.isBot)partner=acc.length?acc[Math.random()*acc.length|0]:null;
  else partner=await ask(p.id,'pickPartner',{responses,give,get});
  if(partner==null||!acc.includes(partner)||!hasRes(p,give)||!hasRes(P(partner),get)){renderAll();return false;}
  const q=P(partner);RES.forEach(r=>{const d=(get[r]||0)-(give[r]||0);p.res[r]+=d;q.res[r]-=d;});ST(p.id).trades++;ST(q.id).trades++;G.undo=[];
  log(`🤝 ${name(p)} ve ${name(q)} takas yaptı: ${resStr(give)} ⇄ ${resStr(get)}`);renderAll();return true;
}
function doBankTrade(p,give,get){
  if(!RES.includes(give)||!RES.includes(get)||give===get)return false;const rt=rate(p,give);
  if(p.res[give]<rt||G.bank[get]<1)return false;
  p.res[give]-=rt;G.bank[give]+=rt;gain(p,get,1);ST(p.id).bank++;log(`🏦 ${name(p)} banka ile takas: ${rt}${RICON[give]} → 1${RICON[get]}`);renderAll();return true;
}

function pick(p,kind,ids,cancellable,msg,cancelLabel){return new Promise(res=>{G.pickState={seat:p.id,kind,ids:new Set(ids),resolve:res,cancellable,cancelLabel};if(msg)G.prompt={seat:p.id,text:msg};renderAll();});}
function cancelPick(){if(G&&G.pickState&&G.pickState.seat===ME&&G.pickState.cancellable){const r=G.pickState.resolve;G.pickState=null;hideTip();renderAll();r(null);}}
function hostPick(seat,id){const ps=G&&G.pickState;if(!ps||ps.seat!==seat)return;
  if(id===null){if(!ps.cancellable)return;}else if(!ps.ids.has(id))return;G.pickState=null;renderAll();ps.resolve(id);}
function ask(seat,what,args,timeout){
  const p=P(seat);
  if(p.isBot)return Promise.resolve(defaultAnswer(seat,what,args));
  if(p.kind==='local')return DLG[what](args);
  return new Promise(res=>{const id=++NET.askId;let done=false;
    const fin=v=>{if(done)return;done=true;NET.pending.delete(id);res(v);};
    NET.pending.set(id,{seat,what,args,fin});broadcastNow();sendTo(seat,{t:'ask',id,what,args});
    if(timeout)setTimeout(()=>fin(defaultAnswer(seat,what,args)),timeout);});
}
function defaultAnswer(seat,what,args){const p=P(seat);
  switch(what){case'discard':return botDiscardSel(p,args.n);case'victim':return args.vic[0];
    case'chooseRes':return args.count===2?botPlenty(p):[botMonopoly(p)];case'tradeOffer':return false;case'pickPartner':return null;}}
async function act(seat,fn){if(G.busy||G.pickState)return;const g=G;g.busy=true;renderAll();
  try{await fn();}catch(e){if(e!==ABORT)console.error(e);}finally{g.busy=false;if(g===G&&G.phase==='main'){if(!checkWin())idlePrompt(seat);renderAll();}}}
function idlePrompt(seat){if(G.current===seat&&G.phase==='main'&&!P(seat).isBot)setPrompt(G.rolled?'İnşa et, takas yap ya da turu bitir.':'Sıra sende! 🎲 Zar at (ya da önce bir gelişim kartı oyna).',seat);}
function buildAct(seat,kind){const p=P(seat),c=COST[kind];
  const spots=kind==='road'?validRoadEdges(p):kind==='settlement'?validSettlementSpots(p):validCitySpots(p);
  const msg={road:'Yolun nereye? (İptal: Esc)',settlement:'Köyünü nereye kuracaksın? (rakam: verim)',city:'Hangi köyü şehre yükselteceksin?'}[kind];
  act(seat,async()=>{const x=await pick(p,kind==='road'?'edge':'vertex',spots,true,msg);
    if(x==null||!canAfford(p,c))return;G.undo.push(undoSnap());pay(p,c);
    if(kind==='road'){placeRoad(p,x);log(`${name(p)} yol yaptı.`);}
    else if(kind==='settlement'){placeSettlement(p,x);log(`${name(p)} köy kurdu.`);}
    else{placeCity(p,x);log(`${name(p)} şehir kurdu! 🏰`);}});
}
function handleAct(seat,what,a){
  a=a||{};if(!G||G.phase!=='main')return;const p=P(seat);
  if(!p||G.current!==seat||p.isBot||!G.endTurnResolve)return;
  const R=G.rolled,free=!G.busy&&!G.pickState;
  switch(what){
    case'roll':if(!R)act(seat,()=>doRoll(p));break;
    case'road':case'settlement':case'city':if(R&&canAfford(p,COST[what]))buildAct(seat,what);break;
    case'dev':if(R&&free&&canAfford(p,COST.dev)&&G.devDeck.length){buyDev(p);renderAll();checkWin();}break;
    case'bank':if(R&&free){const s=undoSnap();if(doBankTrade(p,a.give,a.get)){G.undo.push(s);renderAll();}}break;
    case'undo':if(R&&free&&G.undo.length){restoreSnap(G.undo.pop());log(`↩️ ${name(p)} son hamlesini geri aldı.`);renderAll();}break;
    case'propose':if(R)act(seat,()=>proposeTrade(p,a.give,a.get));break;
    case'play':if(!G.devPlayed&&a.type!=='vp'&&p.dev.includes(a.type))act(seat,()=>playDev(p,a.type));break;
    case'end':if(R&&free)G.endTurnResolve();break;
  }
}
function doAct(what,a){if(NET.role==='client'){if(NET.conn&&NET.conn.open)NET.conn.send({t:'act',what,a});}else handleAct(ME,what,a);}

/* ================== BOT ZEKÂSI ================== */
const DIFFNAME={easy:'Kolay',normal:'Normal',hard:'Zor'};
const BD={easy:{noise:6,stopP:0.4,offer:false,smartRobber:false,knightPro:false,slack:-0.2,leader:9,dump:false},
          normal:{noise:0.8,stopP:0,offer:true,smartRobber:true,knightPro:true,slack:0.3,leader:8,dump:false},
          hard:{noise:0.15,stopP:0,offer:true,smartRobber:true,knightPro:true,slack:0.6,leader:7,dump:true}};
const bd=()=>BD[G.diff]||BD.normal;
function production(p){const pr={wood:0,brick:0,sheep:0,wheat:0,ore:0};
  for(const[list,m]of[[p.settlements,1],[p.cities,2]])for(const v of list)for(const h of G.vertices[v].hexes){const hx=G.hexes[h];if(hx.type!=='desert'&&h!==G.robber)pr[hx.type]+=PIPS[hx.num]*m;}return pr;}
function vertexValue(v,p){
  const vx=G.vertices[v],pr=production(p),seen=new Set();let s=0;
  const early=p.settlements.length+p.cities.length<2;
  for(const h of vx.hexes){const hx=G.hexes[h];if(hx.type==='desert')continue;let pip=PIPS[hx.num];if(h===G.robber)pip*=0.5;
    let w=pr[hx.type]===0?1.35:1;if(early&&(hx.type==='wood'||hx.type==='brick'))w*=1.1;if(!early&&(hx.type==='wheat'||hx.type==='ore'))w*=1.1;
    s+=pip*w;seen.add(hx.type);}
  s+=seen.size*1.1;
  if(vx.port){if(vx.port==='any')s+=1.4;else s+=(pr[vx.port]>=6||seen.has(vx.port))?2.5:0.6;}
  return s;
}
const bestBy=(arr,f)=>{let best=null,bs=-1e9;for(const x of arr){const s=f(x);if(s>bs){bs=s;best=x;}}return best;};
function botSetupVertex(p){return bestBy(validSettlementSpots(p,true),v=>vertexValue(v,p)+Math.random()*bd().noise);}
function farScore(p,far){if(spotFree(far))return vertexValue(far,p)+1;let m=0;for(const u of G.vertices[far].adjV)if(spotFree(u))m=Math.max(m,vertexValue(u,p));return m*0.65;}
function botSetupRoad(p,v){return bestBy(validRoadEdges(p,v),e=>{const ed=G.edges[e],far=ed.v[0]===v?ed.v[1]:ed.v[0];
  let m=0;for(const u of G.vertices[far].adjV)if(u!==v&&spotFree(u))m=Math.max(m,vertexValue(u,p));return m+Math.random()*(0.5+bd().noise/2);});}
function botBestRoad(p,valid){return bestBy(valid,e=>{const ed=G.edges[e],a=inNetwork(p,ed.v[0]),b=inNetwork(p,ed.v[1]);
  let s=(a&&b)?0.5:farScore(p,a?ed.v[1]:ed.v[0]);
  const vx=G.vertices[a?ed.v[1]:ed.v[0]];if(vx.building&&vx.building.player!==p.id)s-=5;
  return s+Math.random()*(0.6+bd().noise/2);});}
const missing=(p,c)=>Object.entries(c).reduce((a,[r,n])=>a+Math.max(0,n-p.res[r]),0);
function botGoal(p){
  const canCity=validCitySpots(p).length>0,spots=validSettlementSpots(p).length>0;
  if(canCity&&canAfford(p,COST.city))return'city';
  if(spots&&canAfford(p,COST.settlement))return'settlement';
  if(spots&&canCity)return missing(p,COST.city)<missing(p,COST.settlement)?'city':'settlement';
  if(spots)return'settlement';
  if(validRoadEdges(p).length&&p.settlements.length<5&&p.roads.length<15)return canCity&&missing(p,COST.city)<=1?'city':'road';
  if(canCity)return'city';
  return'dev';
}
function botTrade(p,goal){
  if(G.diff==='easy'&&total(p)<=7)return;
  const cost=COST[goal];
  for(let k=0;k<6;k++){
    const need=RES.filter(r=>p.res[r]<(cost[r]||0)&&G.bank[r]>0);if(!need.length)break;
    let give=null,ex=0;for(const r of RES){const e=p.res[r]-(cost[r]||0)-rate(p,r);if(e>=0&&p.res[r]-(cost[r]||0)>ex){ex=p.res[r]-(cost[r]||0);give=r;}}
    if(!give)break;const rt=rate(p,give);p.res[give]-=rt;G.bank[give]+=rt;gain(p,need[0],1);ST(p.id).bank++;
    log(`🏦 ${name(p)} banka ile takas: ${rt}${RICON[give]} → 1${RICON[need[0]]}`);
  }
}
async function botMaybeOffer(p,goal){
  if(!bd().offer)return false;
  const c=COST[goal],need=RES.filter(r=>p.res[r]<(c[r]||0));
  if(!need.length||need.length>2)return false;
  const sur=RES.filter(g=>!need.includes(g)&&p.res[g]-(c[g]||0)>=1).sort((a,b)=>(p.res[b]-(c[b]||0))-(p.res[a]-(c[a]||0)));
  if(!sur.length)return false;const g=sur[0],ex=p.res[g]-(c[g]||0);
  if(ex>=rate(p,g))return false;
  if(Math.random()>0.6)return false;
  return proposeTrade(p,{[g]:ex>=3?2:1},{[need[0]]:1});
}
function botDiscardSel(p,n){const sel={},tmp={...p.res};const c=COST[botGoal(p)];
  for(let k=0;k<n;k++){const best=bestBy(RES.filter(r=>tmp[r]),r=>tmp[r]-((c[r]||0)>=tmp[r]?1.5:0)+Math.random()*0.3);
    if(!best)break;tmp[best]--;sel[best]=(sel[best]||0)+1;}return sel;}
function botRobberHex(p){
  const opts=G.hexes.filter(h=>h.id!==G.robber);
  if(!bd().smartRobber){const safe=opts.filter(h=>!h.vertices.some(v=>G.vertices[v].building&&G.vertices[v].building.player===p.id));return(safe.length?safe:opts)[Math.random()*(safe.length||opts.length)|0].id;}
  const leader=Math.max(...G.players.filter(q=>q!==p).map(q=>vp(q,true))),lw=G.diff==='hard'?1.4:0.6;
  return bestBy(opts,h=>{let s=Math.random()*0.3;const pip=h.num?PIPS[h.num]:0;
    for(const v of h.vertices){const b=G.vertices[v].building;if(!b)continue;const m=b.type==='city'?2:1;
      if(b.player===p.id)s-=8*m;else{const q=P(b.player);s+=pip*m*(1+(vp(q,true)===leader?lw:0)+(q.isBot?0:0.15))+(total(q)>0?1:0);}}
    return s;}).id;}
function botShouldKnight(p){if(G.devPlayed||!p.dev.includes('knight'))return false;
  const rob=G.hexes[G.robber].vertices.some(v=>G.vertices[v].building&&G.vertices[v].building.player===p.id);
  if(!bd().knightPro)return rob;
  const laNeed=G.laOwner>=0?P(G.laOwner).knights+1:3;return rob||(G.laOwner!==p.id&&p.knights+1>=laNeed&&p.knights>=1)||(p.dev.filter(d=>d==='knight').length>=2);}
function botPlenty(p){const c=COST[botGoal(p)],out=[];const tmp={...p.res};
  for(let k=0;k<2;k++){let r=RES.find(r=>tmp[r]<(c[r]||0)&&G.bank[r]>0)||RES.filter(r=>G.bank[r]>0).sort((a,b)=>tmp[a]-tmp[b])[0];if(!r)break;tmp[r]++;out.push(r);}return out;}
const othersHold=(p,r)=>G.players.reduce((a,q)=>a+(q!==p?q.res[r]:0),0);
function botMonopoly(p){return bestBy(RES,r=>othersHold(p,r));}
function botMonoWorth(p){return Math.max(...RES.map(r=>othersHold(p,r)))>=4;}
async function botTurn(p){
  setPrompt(`${esc(p.name)} düşünüyor…`);await sleep(700);
  if(!G.rolled){
    if(botShouldKnight(p)){await playDev(p,'knight');if(G.phase!=='main')return;await sleep(400);}
    await doRoll(p);if(G.phase!=='main')return;await sleep(650);
  }
  let devBuys=0,offered=false;
  for(let it=0;it<14;it++){
    if(G.phase!=='main')return;let did=false;
    if(it>0&&Math.random()<bd().stopP)break;
    if(!G.devPlayed){
      if(p.dev.includes('monopoly')&&botMonoWorth(p)){await playDev(p,'monopoly');did=true;}
      else if(p.dev.includes('plenty')){await playDev(p,'plenty');did=true;}
      else if(p.dev.includes('road')&&validRoadEdges(p).length>=1&&p.roads.length<14){await playDev(p,'road');did=true;}
      else if(botShouldKnight(p)){await playDev(p,'knight');did=true;}
      if(G.phase!=='main')return;
    }
    const goal=botGoal(p);
    if(!offered&&!canAfford(p,COST[goal])){offered=true;if(await botMaybeOffer(p,goal))await sleep(500);setPrompt(`${esc(p.name)} düşünüyor…`);}
    botTrade(p,goal);
    const cities=validCitySpots(p),spots=validSettlementSpots(p),roads=validRoadEdges(p);
    if(canAfford(p,COST.city)&&cities.length){const v=bestBy(cities,v=>vertexValue(v,p));pay(p,COST.city);placeCity(p,v);log(`${name(p)} şehir kurdu! 🏰`);did=true;}
    else if(canAfford(p,COST.settlement)&&spots.length){const v=bestBy(spots,v=>vertexValue(v,p)+Math.random()*bd().noise);pay(p,COST.settlement);placeSettlement(p,v);log(`${name(p)} köy kurdu.`);did=true;}
    else if(canAfford(p,COST.road)&&roads.length&&(spots.length===0||total(p)>=8||(p.roadLen>=4&&G.lrOwner!==p.id&&Math.random()<0.5))&&!(spots.length&&missing(p,COST.settlement)<=1&&total(p)<8)){
      const e=botBestRoad(p,roads);pay(p,COST.road);placeRoad(p,e);log(`${name(p)} yol yaptı.`);did=true;}
    else if(canAfford(p,COST.dev)&&G.devDeck.length&&devBuys<2&&(goal==='dev'||total(p)>=7||(goal==='road'&&Math.random()<0.6)||(goal!=='city'&&missing(p,COST[goal])>=2&&Math.random()<0.5))){buyDev(p);devBuys++;did=true;}
    renderAll();if(checkWin())return;
    if(!did)break;await sleep(600);
  }
  if(bd().dump&&total(p)>7&&canAfford(p,COST.dev)&&G.devDeck.length){buyDev(p);renderAll();if(checkWin())return;}
  await sleep(350);
}
function botEvalTrade(bot,give,get,proposer){ // bot 'give' verir, 'get' alır
  if(proposer&&vp(proposer,true)>=bd().leader)return false;
  if(!hasRes(bot,give))return false;
  const c=COST[botGoal(bot)];let gv=0,lv=0;
  for(const r of RES){if(get[r])gv+=get[r]*(bot.res[r]<(c[r]||0)?2:1);
    if(give[r]){const after=bot.res[r]-give[r];lv+=give[r]*(after<(c[r]||0)?2.2:(bot.res[r]>=3?0.7:1));}}
  return gv>=lv+bd().slack;
}

function openModal(html,cls){MODAL_REDRAW=null;const m=$('#modal');m.innerHTML=`<div class="box ${cls||''}">${html}</div>`;m.classList.add('show');return m.querySelector('.box');}
function closeModal(){MODAL_REDRAW=null;const m=$('#modal');m.classList.remove('show');m.innerHTML='';}
const cardHtml=(r,cnt,cls='',sub)=>`<div class="card res-${r} ${cls}" data-r="${r}">${RICON[r]}${cnt!=null?`<span class="c">${cnt}</span>`:''}<span class="n">${RNAME[r]}</span>${sub?`<span class="rt">${sub}</span>`:''}</div>`;
const DLG={
  discard:({n})=>new Promise(res=>{
    attention('Kart atman gerekiyor','alert');
    const p=P(ME),sel={wood:0,brick:0,sheep:0,wheat:0,ore:0};
    const draw=()=>{const sum=RES.reduce((a,r)=>a+sel[r],0);
      const box=openModal(`<h2>🦹 Hırsız Geldi!</h2><p>Elinde ${total(p)} kart var. <b>${n}</b> kart atmalısın.</p>
        <div class="row">${RES.map(r=>`<div class="rc">${cardHtml(r,p.res[r]-sel[r])}<div class="stp"><button data-m="${r}">−</button><b>${sel[r]}</b><button data-p="${r}">+</button></div></div>`).join('')}</div>

    draw();}),
  victim:({vic})=>new Promise(res=>{
    const box=openModal(`<h2>Kimden çalacaksın?</h2><p>Hırsızın bitişiğindeki rakiplerden birini seç.</p>${vic.map(i=>`<div class="resp"><span>${name(P(i))} — ${total(P(i))} kart</span><button class="vbtn" data-i="${i}">Çal</button></div>`).join('')}`);
    box.onclick=e=>{const b=e.target.closest('button');if(b){closeModal();res(+b.dataset.i);}};}),
  chooseRes:({title,msg,count,fromBank})=>new Promise(res=>{
    const sel=[];const draw=()=>{
      const box=openModal(`<h2>${title}</h2><p>${msg}</p><div class="row">${RES.map(r=>`<div class="rc">${cardHtml(r,fromBank?G.bank[r]:null,(fromBank&&G.bank[r]-sel.filter(x=>x===r).length<=0)?'dis':'')}</div>`).join('')}</div>
        <p style="text-align:center">Seçilen: ${sel.map(r=>RICON[r]+' '+RNAME[r]).join(', ')||'—'}</p>
        <div class="actions"><button id="clr">Temizle</button><button class="primary" id="ok" ${sel.length===count?'':'disabled'}>Onayla</button></div>`);
      box.onclick=e=>{const c=e.target.closest('.card');if(c&&!c.classList.contains('dis')&&sel.length<count){sel.push(c.dataset.r);draw();return;}
        const b=e.target.closest('button');if(!b)return;if(b.id==='clr'){sel.length=0;draw();}

const SAVE_KEY='adakol-save',CLIENT_KEY='adakol-client';let saveT=null;
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function saveGame(){if(AUTO||NET.role==='client'||!G||!G.players||!G.players.length)return;if(saveT)return;saveT=setTimeout(()=>{saveT=null;doSave();},300);}
function doSave(){if(AUTO||NET.role==='client'||!G||!G.players||!G.players.length)return;
  if(G.phase==='over'){lsDel(SAVE_KEY);return;}
  const{pickState,endTurnResolve,busy,prompt,...rest}=G;
  lsSet(SAVE_KEY,{v:3,at:Date.now(),net:NET.role==='host'?{code:NET.code,seats:NET.seats.map(s=>({kind:s.kind,name:s.name}))}:null,G:rest});}
function loadSave(){const d=lsGet(SAVE_KEY);if(!d||d.v!==3||!d.G||Date.now()-d.at>7*864e5)return null;return d;}
function clearClientSave(){lsDel(CLIENT_KEY);}
function resumeGame(d){
  gameGen++;closeModal();shownOver=false;MODAL_REDRAW=null;ME=0;
  G={...d.G,pickState:null,endTurnResolve:null,busy:false,prompt:{seat:-1,text:''}};
  $('#log').innerHTML='';renderBoard();showDice(G.lastDice||null);
  if(d.net){
    NET.role='host';NET.code=d.net.code;NET.seats=d.net.seats.map(s=>({...s,conn:null}));NET.conns={};NET.status='connecting';NET.inLobby=false;
    G.players.forEach(p=>{if(p.kind==='remote'||p.disconnected){p.kind='remote';p.isBot=false;p.disconnected=false;NET.seats[p.id].kind='remote';}});
    NET.resumeWait=true;updateNetInfo();renderAll();startPeer(true);showResumeWait();
  }else{NET.role='local';updateNetInfo();appendLog('Oyun kaldığı yerden devam ediyor.','t');renderAll();runGame(true);}
}
function showResumeWait(){
  if(!NET.resumeWait)return;

function continueResume(){

const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode(){let s='';for(let i=0;i<6;i++)s+=CODE_CHARS[Math.random()*CODE_CHARS.length|0];return s;}
function peerOpts(){const m=location.search.match(/peerhost=([^&]+)/);if(m){const[h,pt]=decodeURIComponent(m[1]).split(':');return{host:h,port:+pt||9000,path:'/',secure:false,debug:0};}return{debug:0};}
function errMsg(err){const t=err&&err.type;
  if(t==='peer-unavailable')return'Bu kodla açık bir oda bulunamadı. Kodu ve kurucunun oyunu açık tuttuğunu kontrol et.';
  if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed')return'Bağlantı sunucusuna ulaşılamadı. İnternet bağlantını kontrol et.';
  if(t==='browser-incompatible')return'Bu tarayıcı çok oyunculu bağlantıyı desteklemiyor. Chrome, Edge, Safari ya da Firefox dene.';
  if(t==='unavailable-id')return'Bu oda kodu şu an kullanımda, tekrar deneniyor…';
  return'Bağlantı hatası: '+(t||err);}
function sendTo(seat,msg){const c=NET.conns[seat];if(c&&c.open){try{c.send(msg);}catch(e){console.warn(e);}}}
function broadcast(){if(NET.role!=='host'||NET.bcT)return;NET.bcT=setTimeout(()=>{NET.bcT=null;broadcastNow();},25);}
function broadcastNow(){if(NET.role!=='host'||!G||!G.players||!G.players.length||NET.inLobby)return;for(const k in NET.conns)sendTo(+k,{t:'state',s:snapshot(+k)});}
function snapshot(k){
  const over=G.phase==='over';
  return{boardId:G.boardId,n:G.n,diff:G.diff,hexes:G.hexes,vertices:G.vertices,edges:G.edges,ports:G.ports,bank:G.bank,devDeckN:G.devDeck.length,robber:G.robber,current:G.current,phase:G.phase,
    rolled:G.rolled,devPlayed:G.devPlayed,lrOwner:G.lrOwner,laOwner:G.laOwner,turnNo:G.turnNo,lastRoll:G.lastRoll,lastDice:G.lastDice,rollStats:G.rollStats,stats:G.stats,busy:G.busy,winner:G.winner,
    hasTurn:!!G.endTurnResolve,undoN:G.undo.length,promptText:promptFor(k),
    pick:G.pickState&&G.pickState.seat===k?{kind:G.pickState.kind,ids:[...G.pickState.ids],cancellable:G.pickState.cancellable,cancelLabel:G.pickState.cancelLabel}:null,
    players:G.players.map(p=>{const b={id:p.id,name:p.name,color:p.color,kind:p.kind,isBot:p.isBot,disconnected:!!p.disconnected,knights:p.knights,settlements:p.settlements,cities:p.cities,roads:p.roads,roadLen:p.roadLen,devCount:devCount(p)};
      if(p.id===k||over)return{...b,res:p.res,dev:p.dev,newDev:p.newDev,vpCards:p.vpCards};
      return{...b,res:null,resCount:total(p),dev:[],newDev:[],vpCards:0};})};
}
function openRoom(seats,diff){
  NET.role='host';ME=0;NET.seats=seats.map(s=>({...s,conn:null}));NET.conns={};NET.code=genCode();NET.status='connecting';NET.err='';NET.diff=diff;
  showHostLobby();startPeer(false);
}
function startPeer(keepCode,tries){
  tries=tries||0;
  if(NET.peer){try{NET.peer.destroy();}catch(e){}}
  let peer;try{peer=new Peer('adakol-'+NET.code,peerOpts());}catch(e){NET.status='error';NET.err=errMsg(e);refreshHostUI();return;}
  NET.peer=peer;
  peer.on('open',()=>{NET.status='open';NET.err='';updateNetInfo();refreshHostUI();});
  peer.on('error',err=>{
    if(err.type==='unavailable-id'){if(keepCode&&tries<25){NET.status='connecting';refreshHostUI();setTimeout(()=>{if(NET.role==='host'&&NET.peer===peer)startPeer(true,tries+1);},2500);}else{NET.code=genCode();startPeer(false);}return;}
    if(err.type==='peer-unavailable')return;NET.status='error';NET.err=errMsg(err);refreshHostUI();});
  peer.on('disconnected',()=>{setTimeout(()=>{try{if(!peer.destroyed)peer.reconnect();}catch(e){}},1500);});
  peer.on('connection',conn=>{conn.lastSeen=Date.now();conn.on('data',d=>hostData(conn,d));conn.on('close',()=>hostClose(conn));conn.on('error',()=>hostClose(conn));});
}
function refreshHostUI(){if(NET.resumeWait)showResumeWait();else if(NET.inLobby)showHostLobby();updateNetInfo();}
function sendLobby(){for(const k in NET.conns)sendTo(+k,{t:'lobby',code:NET.code,seats:NET.seats.map(s=>({kind:s.kind,name:s.kind==='bot'?null:s.name,filled:s.kind!=='remote'||!!s.conn}))});}
function hostData(conn,d){
  if(!d||typeof d!=='object')return;conn.lastSeen=Date.now();if(d.t==='ping')return;
  if(d.t==='join'){
    const nm=String(d.name||'Arkadaş').trim().slice(0,16)||'Arkadaş';
    if(!NET.inLobby&&G&&G.players&&G.players.length&&G.phase!=='over'){
      const p=G.players.find(p=>p.kind==='remote'&&p.name===nm)||G.players.find(p=>p.disconnected&&p.name===nm)||G.players.find(p=>p.kind==='remote'&&!NET.conns[p.id])||G.players.find(p=>p.disconnected);
      if(!p){conn.send({t:'reject',reason:'Oyun başlamış ve boş koltuk yok.'});return;}
      const old=NET.conns[p.id];if(old&&old!==conn){old.seat=null;delete NET.conns[p.id];try{old.close();}catch(e){}}
      const wasBot=p.isBot;p.isBot=false;p.kind='remote';p.disconnected=false;conn.seat=p.id;NET.conns[p.id]=conn;NET.seats[p.id].conn=conn;NET.seats[p.id].kind='remote';
      conn.send({t:'joined',seat:p.id,code:NET.code});if(wasBot)log(`🌐 ${name(p)} geri döndü.`);broadcastNow();renderAll();
      if(NET.resumeWait)showResumeWait();return;
    }
    const i=NET.seats.findIndex(s=>s.kind==='remote'&&!s.conn);
    if(i<0||!NET.inLobby){conn.send({t:'reject',reason:'Oda dolu.'});return;}
    NET.seats[i].conn=conn;NET.seats[i].name=nm;conn.seat=i;NET.conns[i]=conn;conn.send({t:'joined',seat:i,code:NET.code});sendLobby();showHostLobby();return;
  }
  if(conn.seat==null||NET.conns[conn.seat]!==conn)return;

  else if(d.t==='pick')hostPick(conn.seat,d.id);
  else if(d.t==='answer'){const pd=NET.pending.get(d.id);if(pd&&pd.seat===conn.seat)pd.fin(d.value);}
}
function hostClose(conn){
  const seat=conn.seat;if(seat==null||NET.conns[seat]!==conn)return;delete NET.conns[seat];

  if(NET.resumeWait){showResumeWait();return;}
  if(!G||!G.players)return;const p=P(seat);if(!p||p.kind!=='remote')return;

  if(G.pickState&&G.pickState.seat===seat){const ps=G.pickState;G.pickState=null;ps.resolve(ps.cancellable?null:[...ps.ids][0]);}
  for(const pd of[...NET.pending.values()])if(pd.seat===seat)pd.fin(defaultAnswer(seat,pd.what,pd.args));

  NET.role='local';NET.conns={};NET.seats=null;NET.code=null;NET.resumeWait=false;updateNetInfo();}
/* --- katılan taraf --- */
function joinRoom(code,nm,retry){
  NET.role='client';NET.code=code;NET.myName=nm;NET.retrying=!!retry;
  if(!retry){NET.inLobby=true;NET.lobbySeats=null;NET.retryCount=0;showClientLobby('Odaya bağlanılıyor…');}
  if(NET.peer){try{NET.peer.destroy();}catch(e){}}
  clearTimeout(NET.joinT);NET.joinT=setTimeout(()=>{if(NET.role==='client'&&!NET.joined)onJoinFail({type:'timeout'});},12000);
  NET.joined=false;
  let peer;try{peer=new Peer(peerOpts());}catch(e){showClientLobby(errMsg(e),true);return;}
  NET.peer=peer;
  peer.on('open',()=>{const conn=peer.connect('adakol-'+code,{reliable:true});NET.conn=conn;
    conn.on('open',()=>{NET.hostSeen=Date.now();conn.send({t:'join',name:nm});});
    conn.on('data',clientData);
    conn.on('close',()=>{if(NET.conn===conn&&NET.joined)clientLost();});});
  peer.on('error',err=>{if(NET.peer!==peer)return;if(NET.joined){if(err.type!=='peer-unavailable')clientLost();}else onJoinFail(err);});
}
function onJoinFail(err){clearTimeout(NET.joinT);
  if(NET.retrying||(G&&G.players&&G.players.length)){scheduleRetry();return;}
  showClientLobby(err.type==='timeout'?'Odaya bağlanılamadı (zaman aşımı). Kodu kontrol edip tekrar dene.':errMsg(err),true);}
function clientLost(){NET.conn=null;NET.joined=false;if(NET.role!=='client')return;NET.retryCount=0;scheduleRetry();}
function scheduleRetry(){
  if(NET.role!=='client')return;NET.retryCount=(NET.retryCount||0)+1;NET.retrying=true;
  if(NET.retryCount>60){NET.retrying=false;
    const box=openModal(`<h2>⚠️ Bağlantı koptu</h2><p>Kurucuya ulaşılamıyor. Kurucu oyunu tekrar açınca “Tekrar bağlan” diyebilirsin.</p><div class="actions"><button id="m">Ana menü</button><button class="primary" id="r">Tekrar bağlan</button></div>`);
    box.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='r'){NET.retryCount=0;joinRoom(NET.code,NET.myName,true);}else backToMenu();};return;}
  const box=openModal(`<h2>🔄 Yeniden bağlanılıyor…</h2><p>Kurucuyla bağlantı kesildi. Otomatik olarak tekrar deneniyor (${NET.retryCount}/60). Bu sırada yerine bot oynayabilir.</p><div class="actions"><button id="m">Ana menüye dön</button></div>`);
  box.onclick=e=>{if(e.target.id==='m')backToMenu();};
  clearTimeout(NET.retryT);NET.retryT=setTimeout(()=>{if(NET.role==='client'&&NET.retrying)joinRoom(NET.code,NET.myName,true);},3000);
}
function clientData(d){
  if(!d||typeof d!=='object')return;NET.hostSeen=Date.now();if(d.t==='ping')return;
  switch(d.t){
    case'joined':ME=d.seat;NET.joined=true;NET.retrying=false;NET.retryCount=0;clearTimeout(NET.joinT);clearTimeout(NET.retryT);
      lsSet(CLIENT_KEY,{code:NET.code,name:NET.myName,at:Date.now()});updateNetInfo();
      if(!(G&&G.players&&G.players.length&&G.boardId)){NET.inLobby=true;showClientLobby('Bağlandın! Kurucunun oyunu başlatması bekleniyor…');}else closeModal();break;
    case'reject':clearTimeout(NET.joinT);NET.retrying=false;showClientLobby(d.reason,true);NET.conn=null;break;
    case'lobby':NET.lobbySeats=d.seats;NET.inLobby=true;showClientLobby('Bağlandın! Kurucunun oyunu başlatması bekleniyor…');break;
    case'state':if(NET.inLobby){NET.inLobby=false;closeModal();}applySnapshot(d.s);break;
    case'log':appendLog(d.html,d.cls);break;
    case'dice':animateDice(d.a,d.b);break;
    case'ask':Promise.resolve(DLG[d.what]?DLG[d.what](d.args):null).then(v=>{if(NET.conn&&NET.conn.open)NET.conn.send({t:'answer',id:d.id,value:v});});break;
    case'closed':NET.conn=null;NET.joined=false;NET.retrying=false;clearClientSave();
      openModal(`<h2>Oda kapandı</h2><p>Kurucu odayı kapattı.</p><div class="actions"><button class="primary" id="m">Ana menü</button></div>`).onclick=e=>{if(e.target.id==='m')backToMenu();};break;
  }
}
function applySnapshot(s){
  const nb=!G||G.boardId!==s.boardId;
  if(nb){shownOver=false;$('#log').innerHTML='';}
  G=s;G.undo={length:s.undoN||0};
  G.pickState=s.pick?{seat:ME,kind:s.pick.kind,ids:new Set(s.pick.ids),cancellable:s.pick.cancellable,cancelLabel:s.pick.cancelLabel,resolve:id=>{if(NET.conn&&NET.conn.open)NET.conn.send({t:'pick',id});}}:null;
  if(nb){renderBoard();showDice(G.lastDice||null);}
  renderAll();
  if(G.phase==='over'&&!shownOver){shownOver=true;showGameOver(P(G.winner));}
}

  const counts={};p.dev.forEach(d=>counts[d]=(counts[d]||0)+1);const nc={};p.newDev.forEach(d=>nc[d]=(nc[d]||0)+1);
  let devs='';for(const t of['knight','road','plenty','monopoly']){if(counts[t])devs+=`<div class="card dev ${idle&&!G.devPlayed?'play':''}" data-dev="${t}" title="${DEVNAME[t]} — dokun: açıklama">${DEVICON[t]}<span class="c">${counts[t]}</span><span class="n">${DEVNAME[t]}</span></div>`;
    if(nc[t])devs+=`<div class="card dev new" data-dev="${t}" data-new="1" title="Bu tur alındı">${DEVICON[t]}<span class="c">${nc[t]}</span><span class="n">${DEVNAME[t]}</span></div>`;}
  if(p.vpCards)devs+=`<div class="card dev" data-dev="vp" title="Zafer Puanı (gizli)">👑<span class="c">${p.vpCards}</span><span class="n">Zafer P.</span></div>`;
  const can=k=>idle&&G.rolled&&canAfford(p,COST[k]);
  const B=(id,ic,lbl,sub,en,cls='',tip='')=>`<button class="btn ${cls}" id="b-${id}" title="${tip}" ${en?'':'disabled'}><span class="bl">${ic} ${lbl}</span>${sub?`<small>${sub}</small>`:''}</button>`;
  const best=Math.min(...RES.map(r=>rate(p,r))),un=G.undo?G.undo.length:0;
  $('#hand').innerHTML=`${tt>7?`<div class="warn7">⚠️ Elinde ${tt} kart — 7 gelirse ${Math.floor(tt/2)} tanesini atarsın</div>`:''}
    <div class="cards">${RES.map(r=>cardHtml(r,p.res[r],p.res[r]?'':'zero',`${rate(p,r)}:1`)).join('')}${devs?`<div class="sep"></div>${devs}`:''}</div>
    <div class="btns">
      ${B('roll','🎲','Zar At','',idle&&!G.rolled,'gold')}
      ${B('road','🛤️','Yol',costStr(COST.road),can('road')&&validRoadEdges(p).length)}
      ${B('settlement','🏠','Köy',costStr(COST.settlement),can('settlement')&&validSettlementSpots(p).length)}
      ${B('city','🏰','Şehir',costStr(COST.city),can('city')&&validCitySpots(p).length)}
      ${B('dev','🃏','Kart',costStr(COST.dev)+` (${deckLen()})`,can('dev')&&deckLen())}
      ${B('bank','🏦','Banka',`${best}:1 takas`,idle&&G.rolled,'','Bankayla/limanla takas')}
      ${B('trade','🤝','Takas','oyuncularla',idle&&G.rolled&&tt>0)}
      ${B('undo','↩️','Geri al',un?`${un} hamle`:'',idle&&G.rolled&&un>0,'','Bu turdaki son inşa/banka takasını geri al')}
      ${B('end','⏭️','Turu Bitir','',idle&&G.rolled,'end')}
    </div>`;
  const on=(id,f)=>{const b=$('#b-'+id);if(b)b.onclick=f;};
  on('roll',()=>doAct('roll'));on('road',()=>doAct('road'));on('settlement',()=>doAct('settlement'));on('city',()=>doAct('city'));on('dev',()=>doAct('dev'));
  on('bank',bankDialog);on('trade',tradeDialog);on('undo',()=>doAct('undo'));on('end',()=>doAct('end'));
  $('#hand').querySelectorAll('.dev[data-dev]').forEach(el=>el.onclick=()=>devInfo(el.dataset.dev,!!el.dataset.new));
}
function renderAll(){if(!G)return;renderTokens();renderPieces();
  if(!G.players||!G.players.length){$('#hl').innerHTML='';renderPrompt();return;}
  renderHighlights();renderPlayers();renderHand();renderPrompt();renderStats();
  if(MODAL_REDRAW)MODAL_REDRAW();
  const need=needsMe();if(need&&!lastNeed)attention(need,'turn');lastNeed=need;
  broadcast();saveGame();}
/* --- yakınlaştırma / kaydırma --- */
const VB0={x:-324,y:-298,w:648,h:596};let VB={...VB0},dragMoved=false;
const svgEl=$('#board');
function applyVB(){VB.w=Math.min(VB0.w,Math.max(VB0.w/4,VB.w));VB.h=VB.w*VB0.h/VB0.w;
  VB.x=Math.min(Math.max(VB.x,VB0.x),VB0.x+VB0.w-VB.w);VB.y=Math.min(Math.max(VB.y,VB0.y),VB0.y+VB0.h-VB.h);
  svgEl.setAttribute('viewBox',`${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${VB.w.toFixed(1)} ${VB.h.toFixed(1)}`);
  $('#zReset').style.visibility=VB.w<VB0.w-1?'visible':'hidden';$('#zOut').disabled=VB.w>=VB0.w-1;}
function resetZoom(){VB={...VB0};applyVB();}
function toSvg(cx,cy){const m=svgEl.getScreenCTM();if(!m)return{x:VB.x+VB.w/2,y:VB.y+VB.h/2};const pt=svgEl.createSVGPoint();pt.x=cx;pt.y=cy;return pt.matrixTransform(m.inverse());}
function zoomAt(f,c){const nw=Math.min(VB0.w,Math.max(VB0.w/4,VB.w/f)),k=nw/VB.w;VB.x=c.x-(c.x-VB.x)*k;VB.y=c.y-(c.y-VB.y)*k;VB.w=nw;applyVB();}
function zoomCenter(f){zoomAt(f,{x:VB.x+VB.w/2,y:VB.y+VB.h/2});}
$('#zIn').onclick=()=>zoomCenter(1.4);$('#zOut').onclick=()=>zoomCenter(1/1.4);$('#zReset').onclick=resetZoom;
svgEl.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0018)),toSvg(e.clientX,e.clientY));},{passive:false});
const ptrs=new Map();let drag=null,pinch=null;
svgEl.addEventListener('pointerdown',e=>{if(e.button>0)return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});dragMoved=false;
  if(ptrs.size===1){const m=svgEl.getScreenCTM();drag={x:e.clientX,y:e.clientY,vx:VB.x,vy:VB.y,s:m?1/m.a:1};}
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,w:VB.w,c:toSvg((a.x+b.x)/2,(a.y+b.y)/2)};drag=null;dragMoved=true;}});
window.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);const tw=pinch.w*pinch.d/d;zoomAt(VB.w/tw,pinch.c);return;}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!dragMoved&&Math.hypot(dx,dy)<7)return;
    if(VB.w>=VB0.w-1)return;dragMoved=true;svgEl.classList.add('dragging');hideTip();VB.x=drag.vx-dx*drag.s;VB.y=drag.vy-dy*drag.s;applyVB();}});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size){drag=null;svgEl.classList.remove('dragging');}};
window.addEventListener('pointerup',endPtr);window.addEventListener('pointercancel',endPtr);
svgEl.addEventListener('click',e=>{if(dragMoved){e.stopPropagation();e.preventDefault();dragMoved=false;}},true);
/* --- ipucu balonu --- */
function hideTip(){$('#tip').style.display='none';}
$('#board').addEventListener('mouseover',ev=>{const t=ev.target.closest('[data-pick]');if(!t||!G||!G.pickState||G.pickState.seat!==ME){hideTip();return;}
  const h=tipHtml(G.pickState.kind,+t.dataset.pick);if(!h){hideTip();return;}const tip=$('#tip');tip.innerHTML=h;tip.style.display='block';});
$('#board').addEventListener('mousemove',ev=>{const tip=$('#tip');if(tip.style.display!=='block')return;const r=$('#boardWrap').getBoundingClientRect();
  let x=ev.clientX-r.left+16,y=ev.clientY-r.top+16;if(x+tip.offsetWidth>r.width)x=ev.clientX-r.left-tip.offsetWidth-12;if(y+tip.offsetHeight>r.height)y=ev.clientY-r.top-tip.offsetHeight-12;tip.style.left=x+'px';tip.style.top=y+'px';});
$('#board').addEventListener('mouseleave',hideTip);
$('#board').addEventListener('click',ev=>{const t=ev.target.closest('[data-pick]');if(!t||!G||!G.pickState||G.pickState.seat!==ME)return;const id=+t.dataset.pick;
  if(!G.pickState.ids.has(id))return;hideTip();const r=G.pickState.resolve;G.pickState=null;renderAll();r(id);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&G)cancelPick();});
$('#newBtn').onclick=()=>{const inGame=G&&G.players&&G.players.length&&G.phase!=='over';
  if(!inGame||confirm(NET.role==='client'?'Odadan çıkmak istiyor musun? (Yerine bot oynar)':'Oyun bitirilip ana menüye dönülsün mü? (Kayıt silinir)'))backToMenu();};
$('#rulesBtn').onclick=showRules;
$('#soundBtn').onclick=()=>{SOUND=!SOUND;try{localStorage.setItem('adakol-sound',SOUND?'1':'0');}catch(e){}updateNetInfo();if(SOUND)beep('turn');};
$('#sideBtn').onclick=()=>document.body.classList.toggle('side-open');
$('#shade').onclick=()=>document.body.classList.remove('side-open');
$('#speed').onchange=e=>SPEED=+e.target.value;
setInterval(()=>{const now=Date.now();
  if(NET.role==='host')for(const k in NET.conns){const c=NET.conns[k];if(now-(c.lastSeen||now)>15000){try{c.close();}catch(e){}hostClose(c);}else sendTo(+k,{t:'ping'});}
  if(NET.role==='client'&&NET.conn&&NET.conn.open&&NET.joined){try{NET.conn.send({t:'ping'});}catch(e){}if(now-(NET.hostSeen||now)>15000){const c=NET.conn;NET.conn=null;try{c.close();}catch(e){}clientLost();}}
},3000);
window.addEventListener('pagehide',()=>{doSave();try{if(NET.conn)NET.conn.close();}catch(e){}});
updateNetInfo();
if(AUTO){const n=/three/.test(location.search)?3:4,dm=location.search.match(/diff=(\w+)/);newGame(Array.from({length:n},()=>({kind:'bot'})),dm?dm[1]:'normal');}
else{menuBoard();showStart();}
</script>
